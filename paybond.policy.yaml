# Reference implementation — edit freely.
# Tool keys must match the Microsoft Agent Framework tool names (function names).

version: 1
name: procurement-agent-maf-v1
default_deny: true

tools:
  submit_po:
    side_effecting: true
    spend_from_args: amount_cents
    evidence_preset: cost_and_completion

  search_catalog:
    side_effecting: false

intent:
