# Reference policy for CLI smoke (`npm run smoke`).
# Runtime spend for app.py / agent.py is resolved in paybond_wiring.py from the
# catalog (SKU × quantity) — not from an agent-supplied amount_cents field.

version: 1
name: procurement-agent-maf-v1
default_deny: true

tools:
  submit_po:
    side_effecting: true
    # Cap for policy-driven tooling; the demo's live spend resolver is catalog-backed.
    max_spend_cents: 25000
    evidence_preset: cost_and_completion

  search_catalog:
    side_effecting: false

intent:
  allowed_tools:
    - submit_po
  budget:
    currency: usd
    max_spend_usd: 250
